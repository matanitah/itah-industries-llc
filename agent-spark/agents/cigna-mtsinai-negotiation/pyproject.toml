[project]
name = "cigna-mtsinai-negotiation"
version = "0.1.0"
description = "Long-running Cigna <-> Mt Sinai contract-leverage crawl agent + Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-spark-core",
]

[tool.uv.sources]
agent-spark-core = { path = "../../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_def"]

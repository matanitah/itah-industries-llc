[project]
name = "agent-spark-core"
version = "0.1.0"
description = "Reusable long-running-agent + Streamlit-dashboard pattern shared by agent-spark/agents/*"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "pandas>=3.0.5",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pypdf2>=3.0.1",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.2",
    "streamlit>=1.61.0",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_spark_core"]
